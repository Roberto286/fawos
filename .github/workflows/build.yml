name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

  build-iso:
    name: Generate Installer ISO
    runs-on: ubuntu-latest
    needs: bluebuild
    if: github.event_name != 'pull_request' # Genera l'ISO solo sui push e build programmate, non sulle Pull Request
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build ISO using Container Installer
        uses: jasonn3/build-container-installer@v1
        id: build
        with:
          # Ricava automaticamente il nome dell'immagine basandosi sul nome del tuo repository GitHub
          image-name: ${{ github.event.repository.name }}
          image-repo: ghcr.io/${{ github.repository_owner }}
          image-tag: latest
          
          # Inserisci qui la versione della base (es. 41 per Fedora 41 Atomic / Silverblue)
          version: 41 
          variant: 'fedora'

      - name: Upload ISO as a GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-iso
          path: |
            ${{ steps.build.outputs.iso-path }}
            ${{ steps.build.outputs.iso-sha256 }}
          if-no-files-found: error
          retention-days: 7
