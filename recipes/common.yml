# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: chezmoi
    repository: "https://github.com/roberto286/dotfiles"
    # Locally changed dotfiles are kept; fawos-update lists them for `chezmoi re-add`.
    file-conflict-policy: skip

  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      cleanup: true
      copr:
        enable:
          - duxlabs/dms
          - yalter/niri
          - alebastr/greetd
          - jdxcode/mise
          - duxlabs/dux-repo
    install:
      allow-erasing: true
      install-weak-deps: false
      packages:
        # Core Session & Compositor
        - niri
        - wayland-utils
        - xdg-desktop-portal-gnome
        - power-profiles-daemon
        - fprintd
        - make
        
        # Dux suite (duxlabs/dms + duxlabs/dux-repo)
        - dms
        - dux-greeter
        - dux-gop
        - dux-search
        - dux-calendar
        - dux-files
        # DMS optional features (dms only Recommends these; weak deps are off)
        - matugen
        - cava
        - qt6-qtmultimedia
        - qt6-qtimageformats
        - kf6-kimageformats
        - cups-pk-helper
        - adw-gtk3-theme
        - wl-clipboard
        # Quick Capture plugin (screen recording, OCR, QR, exports)
        - wf-recorder
        - ffmpeg-free
        - ImageMagick
        - python3-img2pdf
        - tesseract
        - tesseract-langpack-ita
        - zbar
        - brightnessctl
        - greetd
        # LibrePods runtime (built below) and the DMS airpods/airdrop plugins
        - bluez
        - pulseaudio-libs
        - iproute
        - kio-extras
        - breeze-icon-theme
        # Omdrop (AirDrop) receiver/sender runtime
        - python3-libarchive-c
        - python3-pillow
        - python3-zeroconf
        - python3-ifaddr
        - python3-dbus
        - python3-gobject
        - keyutils
        - fastfetch

        # Terminal & DevTools
        - ghostty
        - neovim       
        - fish
        - git
        - ripgrep     
        - fd-find
        - mise
        - gh
        - fzf
        - gcc
        - podman-compose

        # Desktop integration
        - gvfs
        - udisks2
        - qt6-qtpdf
        - gnome-keyring
        - gnome-keyring-pam
        - gcr
        - wtype
        - argon2
        - jq

        # Gaming: controller udev rules only; Steam itself is per-machine (dotfiles)
        - steam-devices

        # Snapshots
        - btrfs-progs
        - snapper
        - btrfs-assistant

    remove:
      packages:
        - firefox
        - firefox-langpacks
        - alacritty

  # snapper-libs ships SNAPPER_CONFIGS="" (%config); register the home config
  # from files/system/etc/snapper/configs/home so the timeline actually runs.
  - type: script
    snippets:
      - sed -i 's/^SNAPPER_CONFIGS=.*/SNAPPER_CONFIGS="home"/' /etc/sysconfig/snapper && grep -qx 'SNAPPER_CONFIGS="home"' /etc/sysconfig/snapper
      # dux-greeter's %post writes a minimal /etc/pam.d/greetd (no pam_gnome_keyring) when
      # greetd's /usr/lib/pam.d/greetd is missing; keep the guard so keyring unlock at login survives.
      - rm -f /etc/pam.d/greetd && grep -q pam_gnome_keyring /usr/lib/pam.d/greetd

  # Replace only the stock Fedora kernel; fail if CachyOS is unavailable.
  - type: dnf
    env:
      DRACUT_NO_XATTR: "1"
    repos:
      cleanup: true
      copr:
        enable:
          - bieszczaders/kernel-cachyos
    remove:
      auto-remove: false
      packages:
        - kernel
        - kernel-core
        - kernel-modules
        - kernel-modules-core
        - kernel-modules-extra
    install:
      install-weak-deps: false
      packages:
        - kernel-cachyos

  - type: script
    snippets:
      # Persist the policy without reloading the build host's SELinux policy.
      - setsebool -N -P domain_kernel_load_modules on
      # The RPM also writes this redundant symbol file outside the bootc kernel tree.
      - rm -f "/boot/symvers-$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-cachyos-core).zst"

  # LibrePods (AirPods features, Rust rewrite) is not packaged for Fedora: build it from a
  # pinned commit and drop the toolchain again. fawos-librepods-watch starts it on demand.
  - type: script
    snippets:
      - |
        set -euo pipefail
        rev=672e65ad36eebf21ff1c1a508066f9197ee56d17
        dnf install -y --setopt=install_weak_deps=False rust cargo gcc pkgconf-pkg-config dbus-devel pulseaudio-libs-devel bluez-libs-devel
        git clone -q https://github.com/kavishdevar/librepods.git /tmp/librepods
        git -C /tmp/librepods checkout -q "$rev"
        cd /tmp/librepods/linux-rust
        cargo build --release --locked
        install -Dm755 target/release/librepods /usr/bin/librepods
        install -Dm644 assets/me.kavishdevar.librepods.desktop /usr/share/applications/me.kavishdevar.librepods.desktop
        install -Dm644 assets/icon.png /usr/share/icons/hicolor/256x256/apps/me.kavishdevar.librepods.png
        cd /
        rm -rf /tmp/librepods /root/.cargo
        dnf remove -y rust cargo gcc dbus-devel pulseaudio-libs-devel bluez-libs-devel

  # AirDrop for the DMS AirDrop plugin, which only accepts omdrop 0.14.1. Owly (omdrop-owl)
  # is the radio backend; whether it works depends on the Wi-Fi card (`owly doctor`).
  - type: script
    snippets:
      - |
        set -euo pipefail
        rpm=owly-0.4.3-1.x86_64.rpm
        curl -fsSL -o "/tmp/$rpm" "https://github.com/t4t5/owly/releases/download/v0.4.3/$rpm"
        echo "592f0c525c4f914212fe6589fc75e9f344fdafa8425daae88114359aeb9600e1  /tmp/$rpm" | sha256sum -c -
        dnf install -y "/tmp/$rpm"
        rm -f "/tmp/$rpm"
        git clone -q https://github.com/netmojo-systems/omdrop-plugin.git /tmp/omdrop
        git -C /tmp/omdrop checkout -q v0.14.1
        install -d /usr/share/omdrop
        cp -r /tmp/omdrop/bin /tmp/omdrop/share /tmp/omdrop/manifest.json /usr/share/omdrop/
        ln -s /usr/share/omdrop/bin/omdrop /usr/bin/omdrop
        rm -rf /tmp/omdrop
        omdrop version | grep -qx 'omdrop 0.14.1'
