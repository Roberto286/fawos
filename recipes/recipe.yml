# yaml-language-server: $schema=https://blue-build.org
# image will be published to ghcr.io/<user>/<name>
name: fawos
# description will be included in the image's metadata
description: Finally A Working OS! 

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: chezmoi
    repository: "https://github.com/roberto286/dotfiles"
    file-conflict-policy: replace

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      cleanup: true
      copr:
        enable:
          - avengemedia/danklinux
          - scottames/ghostty
          - yalter/niri
          - alebastr/greetd
          - jdxcode/mise
    install:
      # OPZIONI DI RISOLUZIONE DIPENDENZE (Accettate nativamente dal modulo dnf di BlueBuild)
      allow-erasing: true
      install-weak-deps: false
      packages:
        # Core Session & Compositor
        - niri
        - wayland-utils
        - xdg-desktop-portal-gnome
        
        # DMS & Utility Shell
        - dms
        - dms-greeter
        - brightnessctl
        - greetd
        
        # Terminal & DevTools
        - ghostty
        - neovim       
        - fish
        - git
        - ripgrep     
        - fd-find
        - mise

    remove:
      packages:
        - firefox
        - firefox-langpacks
        - alacritty

  # Replace only the stock Fedora kernel; fail if CachyOS is unavailable.
  - type: dnf
    env:
      DRACUT_NO_XATTR: "1"
    repos:
      cleanup: true
      copr:
        enable:
          - bieszczaders/kernel-cachyos
    remove:
      auto-remove: false
      packages:
        - kernel
        - kernel-core
        - kernel-modules
        - kernel-modules-core
        - kernel-modules-extra
    install:
      install-weak-deps: false
      packages:
        - kernel-cachyos

  - type: script
    snippets:
      # Persist the policy without reloading the build host's SELinux policy.
      - setsebool -N -P domain_kernel_load_modules on
      # The RPM also writes this redundant symbol file outside the bootc kernel tree.
      - rm -f "/boot/symvers-$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-cachyos-core).zst"

  - type: initramfs
    env:
      DRACUT_NO_XATTR: "1"

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.chromium.Chromium
          - org.chromium.Chromium.Codecs
          - org.gnome.Loupe
          - com.bitwarden.desktop
          - org.libreoffice.LibreOffice
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

  - type: systemd
    system:
      enabled:
        - greetd
